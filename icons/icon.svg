<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#212a24"/>
      <stop offset="100%" stop-color="#111514"/>
    </radialGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ff96"/>
      <stop offset="100%" stop-color="#b6e257"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#303a33" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Arcade subtle background dots / grid -->
  <g fill="#253127" opacity="0.4">
    <circle cx="80" cy="80" r="4"/>
    <circle cx="432" cy="80" r="4"/>
    <circle cx="80" cy="432" r="4"/>
    <circle cx="432" cy="432" r="4"/>
    <circle cx="256" cy="70" r="3"/>
    <circle cx="256" cy="442" r="3"/>
  </g>

  <!-- Arcade Star Accents -->
  <path d="M 120 180 Q 120 195 105 195 Q 120 195 120 210 Q 120 195 135 195 Q 120 195 120 180 Z" fill="#d1f478" opacity="0.75"/>
  <path d="M 390 140 Q 390 155 375 155 Q 390 155 390 170 Q 390 155 405 155 Q 390 155 390 140 Z" fill="#edc778" opacity="0.8"/>
  <circle cx="395" cy="350" r="6" fill="#d1f478" opacity="0.7"/>

  <!-- Center Badge (rotated -9deg) with Brand Mark 'a' -->
  <g transform="translate(256, 256) rotate(-9)" filter="url(#shadow)">
    <!-- Badge Background -->
    <rect x="-140" y="-140" width="280" height="280" rx="58" fill="url(#badgeGrad)"/>
    <rect x="-132" y="-132" width="264" height="264" rx="50" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.35"/>

    <!-- Letter 'a' bold grotesque glyph -->
    <text x="0" y="70" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="220" font-weight="900" fill="#111514" text-anchor="middle" dominant-baseline="alphabetic">a</text>
  </g>

  <!-- Mini dot indicator (accent neon) -->
  <circle cx="370" cy="380" r="14" fill="#d1f478"/>
</svg>
