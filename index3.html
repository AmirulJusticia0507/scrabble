<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pachinko — Little Arcade</title>
  <link rel="stylesheet" href="arcade.css">
</head>
<body data-game="pachinko">
  <main class="shell">
    <div id="header"></div>
    <div class="layout">
      <section class="arena">
        <div class="arena-head">
          <h2>Let it drop</h2>
          <span class="tag" id="boardLevel">LEVEL 01 / SANTAI</span>
        </div>
        <div class="board-space">
          <div class="pachinko-wrap">
            <canvas id="game" width="460" height="490" aria-label="Papan Pachinko dengan lima slot skor: 10, 25, 50, 25, 10."></canvas>
          </div>
        </div>
        <div class="arena-foot">
          <span><span class="live-dot">●</span> Tiga bola. Banyak kemungkinan.</span>
          <button id="sound" class="secondary" style="padding:6px 12px;font-size:12px" aria-pressed="false">Suara: mati</button>
        </div>
      </section>

      <aside>
        <section class="card">
          <span class="eyebrow">Total skor</span>
          <div id="score" class="score" aria-live="polite">0</div>
          <div class="stats">
            <div>
              <span class="small">Bola turun</span>
              <strong id="drops">0</strong>
            </div>
            <div>
              <span class="small">Rekor sesi</span>
              <strong id="best">0</strong>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-title">
            <h2>Coba keberuntunganmu</h2>
            <span>✧</span>
          </div>
          <label for="level">Kepadatan rintangan</label>
          <select id="level">
            <option value="1">01 — Santai</option>
            <option value="2">02 — Ramai</option>
            <option value="3">03 — Penuh kejutan</option>
          </select>
          <button id="drop" class="primary wide">Jatuhkan 3 bola &nbsp; ↓</button>
          <p id="notice" class="notice" role="status">Siap? Setiap bola membawa poin baru.</p>
        </section>

        <section class="card">
          <div class="card-title">
            <h2>Riwayat drop</h2>
            <button id="reset" class="secondary" style="padding:6px 10px;font-size:11px">Reset</button>
          </div>
          <p id="empty" class="empty">Belum ada bola turun. Mulai putaran pertamamu!</p>
          <ul id="history" class="history" aria-label="Riwayat skor"></ul>
        </section>
      </aside>
    </div>
    <footer id="footer" class="footer"></footer>
  </main>

  <script src="arcade.js"></script>
  <script src="pachinko.js"></script>
</body>
</html>
